<svg xmlns="http://www.w3.org/2000/svg" width="640" height="982" viewBox="0 0 640 982" role="img" aria-labelledby="title desc">
<title id="title">AI ticket workflow</title>
<desc id="desc">Start at the first stage that needs work: clarify behavior, plan the change, implement and review, then verify behavior. New findings return to the first affected stage. Environment failures stay in verification. Stop at requested checkpoints.</desc>
<rect width="640" height="982" rx="24" fill="#f6f8fc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="320" y="42" text-anchor="middle" font-size="28" fill="#475569">Use only the necessary stages</text>
<rect x="24" y="72" width="592" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="70" cy="126" r="25" fill="#e8efff"/>
<text x="70" y="136" text-anchor="middle" font-size="28" fill="#2456a6">1</text>
<text x="112" y="115" font-size="32" font-weight="bold" fill="#0f172a">Clarify behavior</text>
<text x="112" y="153" font-size="28" fill="#475569">Expected results and task limits</text>
<path d="M320 183 V204 M312 196 L320 204 L328 196" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="210" width="592" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="70" cy="264" r="25" fill="#e8efff"/>
<text x="70" y="274" text-anchor="middle" font-size="28" fill="#2456a6">2</text>
<text x="112" y="253" font-size="32" font-weight="bold" fill="#0f172a">Plan the change</text>
<text x="112" y="291" font-size="28" fill="#475569">Affected code and useful tests</text>
<path d="M320 321 V342 M312 334 L320 342 L328 334" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="348" width="592" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="70" cy="402" r="25" fill="#e8efff"/>
<text x="70" y="412" text-anchor="middle" font-size="28" fill="#2456a6">3</text>
<text x="112" y="391" font-size="32" font-weight="bold" fill="#0f172a">Implement and review</text>
<text x="112" y="429" font-size="28" fill="#475569">Focused edits and code review</text>
<path d="M320 459 V480 M312 472 L320 480 L328 472" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="486" width="592" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="70" cy="540" r="25" fill="#e8efff"/>
<text x="70" y="550" text-anchor="middle" font-size="28" fill="#2456a6">4</text>
<text x="112" y="529" font-size="32" font-weight="bold" fill="#0f172a">Verify behavior</text>
<text x="112" y="567" font-size="28" fill="#475569">Actual results and missing checks</text>
<rect x="24" y="630" width="592" height="278" rx="16" fill="#e8efff"/>
<text x="48" y="675" font-size="30" font-weight="bold" fill="#173e7b">New findings: choose the stage</text>
<text x="48" y="724" font-size="28" fill="#334155">Requirement</text><path d="M235 715 H268 M260 707 L268 715 L260 723" fill="none" stroke="#2456a6" stroke-width="2.5"/><text x="286" y="724" font-size="28" fill="#173e7b">Clarify behavior</text>
<text x="48" y="771" font-size="28" fill="#334155">Approach</text><path d="M235 762 H268 M260 754 L268 762 L260 770" fill="none" stroke="#2456a6" stroke-width="2.5"/><text x="286" y="771" font-size="28" fill="#173e7b">Plan the change</text>
<text x="48" y="818" font-size="28" fill="#334155">Code defect</text><path d="M235 809 H268 M260 801 L268 809 L260 817" fill="none" stroke="#2456a6" stroke-width="2.5"/><text x="286" y="818" font-size="28" fill="#173e7b">Implement and review</text>
<text x="48" y="865" font-size="28" fill="#334155">Environment</text><path d="M235 856 H268 M260 848 L268 856 L260 864" fill="none" stroke="#2456a6" stroke-width="2.5"/><text x="286" y="865" font-size="28" fill="#173e7b">Stay in verification</text>
<text x="320" y="955" text-anchor="middle" font-size="28" fill="#475569">Stop at requested checkpoints</text></g></svg>
